<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEMO</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>DEMO</h1>
    </header>

    <main class="main">
      <div class="game-area">
        <canvas id="gameCanvas" width="640" height="480"></canvas>
        <div id="message" class="message" aria-live="polite"></div>
      </div>

      <aside class="sidebar">
        <section class="panel">
          <h2>フェーズ</h2>
          <p id="phaseText" class="phase-text">—</p>
          <button id="startBattleBtn" type="button" class="btn btn-primary">戦闘開始</button>
        </section>

        <section class="panel">
          <h2>ユニット情報</h2>
          <div id="unitInfo" class="unit-info">
            <p class="placeholder">マスを選択してください</p>
          </div>
        </section>

        <section class="panel panel-help">
          <h2>操作</h2>
          <ul class="help-list">
            <li>味方クリック: ユニット選択</li>
            <li>マスクリック: 移動先指定（経路を表示）</li>
            <li>川には進入・指定不可</li>
            <li>自分のマス: 移動指示の解除</li>
            <li>「戦闘開始」で戦闘フェーズへ</li>
            <li>戦闘中: 1秒に1ターン自動進行</li>
            <li>3ターン変化なし / 味方全滅で指示へ</li>
            <li>敵全滅でゲームクリア</li>
            <li>敵: 待機、赤範囲内で接近・攻撃</li>
            <li>矢印キー: カーソル移動</li>
            <li>Esc: 選択解除</li>
          </ul>
        </section>
      </aside>
    </main>

    <footer class="footer">
      <button id="restartBtn" type="button" class="btn btn-secondary" hidden>もう一度</button>
    </footer>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
