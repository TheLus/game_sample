<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEMO</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>DEMO</h1>
    </header>

    <main class="main">
      <div class="game-column">
        <div class="game-area">
          <canvas id="gameCanvas" width="640" height="480"></canvas>
          <div id="message" class="message" aria-live="polite"></div>
        </div>

        <div id="unitShopBar" class="unit-shop-bar">
          <p class="shop-bar-label">配置するユニット</p>
          <div id="unitShop" class="unit-shop"></div>
        </div>
      </div>

      <aside class="sidebar">
        <section class="panel">
          <p id="goldText" class="gold-text">資金: —</p>
          <button id="startBattleBtn" type="button" class="btn btn-primary">戦闘開始</button>
        </section>

        <section class="panel">
          <h2>ユニット情報</h2>
          <div id="unitInfo" class="unit-info">
            <p class="placeholder">マスを選択してください</p>
          </div>
        </section>

        <section class="panel panel-help">
          <h2>操作</h2>
          <ul class="help-list">
            <li>下のユニット選択→黄枠内クリックで配置</li>
            <li>配置済み: ドラッグで位置変更</li>
            <li>マップ外へドラッグで売却</li>
            <li>クリック: 移動先の指定</li>
            <li>「戦闘開始」で戦闘フェーズへ</li>
            <li>矢印キー: カーソル / Esc: 解除</li>
          </ul>
        </section>
      </aside>
    </main>

    <footer class="footer">
      <button id="restartBtn" type="button" class="btn btn-secondary" hidden>もう一度</button>
    </footer>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
